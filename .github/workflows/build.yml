name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax)
        working-directory: backend
        run: python -m py_compile main.py style_extractor.py video_editor.py

      - name: Import smoke test (catches import/wiring errors)
        working-directory: backend
        run: python -c "import main; print('FastAPI app loaded OK:', main.app.title)"

  frontend:
    name: Frontend (static)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS syntax check
        working-directory: frontend
        run: node --check app.js

      - name: Verify required files exist
        working-directory: frontend
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          
